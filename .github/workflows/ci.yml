name: CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  backend:
    name: Backend CI (Lint, Test, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: it_service_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000,http://localhost:4000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/it_service_platform_test?schema=public
      JWT_SECRET: ci-testing-jwt-secret-key-12345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run Database Migrations
        run: npx prisma migrate deploy

      - name: Seed Database
        run: npm run seed

      - name: Run Backend Tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

  frontend:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build

  e2e:
    name: E2E Playwright Tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: it_service_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Prepare Backend Database (Migrations & Seed)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/it_service_platform_test?schema=public
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run seed

      - name: Start Backend Server
        working-directory: backend
        env:
          PORT: 4000
          NODE_ENV: development
          CORS_ORIGIN: http://localhost:3000,http://localhost:4000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/it_service_platform_test?schema=public
          JWT_SECRET: ci-testing-jwt-secret-key-12345
        run: |
          npm run dev &
          for i in {1..30}; do
            if curl -s http://localhost:4000/api/health | grep -q "API is running"; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting for backend..."
            sleep 1
          done

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          CI: true
        run: npx playwright test

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
